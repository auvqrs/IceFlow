<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledena</title>

    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
</head>
<body>

<div class="top">
    <div class="top-left">
        <img src="icon.png">
        <h1>Ledena</h1>
    </div>
    <div class="top-right">
        <button id="homeBtn">Početna</button>
        <button id="mapBtn">Mapa</button>
    </div>
</div>

<div class="content">
    <div class="adrese" id="adrese">
        <p>Dodajte adrese</p>

        <input id="urlInput" placeholder="Unesi adresu">
        <ul id="suggestions"></ul>

        <button id="goButton">Dodaj adresu</button>
        <button id="startRoute">Započni rutu</button>
        <button id="clearAll">Obriši sve</button>
        <button id="shareRoute">Podeli rutu</button>
        <button id="printRoute">Štampa</button>

        <ol id="list"></ol>
    </div>

    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
